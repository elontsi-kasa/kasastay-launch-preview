<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kasastay · Tombola · 30 mai</title>
<meta name="description" content="Tirage au sort de la soirée de lancement Kasastay." />
<meta name="theme-color" content="#0a0a0c" />
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">

<style>
:root{
  --ink:        #fafafa;
  --ink-soft:   rgba(250,250,250,.78);
  --ink-mute:   rgba(250,250,250,.55);
  --ink-faint:  rgba(250,250,250,.32);
  --brand:      #0e7490;
  --brand-bright:#08BDB7;
  --gold:       #f5b450;
  --night:      #0a0a0c;
  --night-2:    #18181b;
  --night-3:    #27272a;
  --f-sans:     "Geist", system-ui, sans-serif;
  --f-mono:     "Geist Mono", ui-monospace, monospace;
}

*,*::before,*::after{ box-sizing:border-box; }
html, body{
  margin:0; padding:0;
  background:var(--night);
  color:var(--ink);
  font-family:var(--f-sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  overflow-x:hidden;
}
a{ color:inherit; text-decoration:none; }
button{ font:inherit; cursor:pointer; border:0; background:none; color:inherit; }
input{ font:inherit; color:inherit; background:none; border:0; outline:0; }
::selection{ background:var(--brand-bright); color:var(--night); }

/* atmosphere */
body{
  background:
    radial-gradient(70% 80% at 50% 35%, rgba(8,189,183,.16), transparent 60%),
    radial-gradient(40% 60% at 15% 90%, rgba(245,180,80,.06), transparent 70%),
    linear-gradient(180deg, #0c1f24 0%, var(--night) 80%);
}
body::after{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  z-index:60;
  opacity:.22;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/></svg>");
}

/* nav */
.nav-bar{
  position:fixed; top:0; left:0; right:0;
  z-index:70;
  padding:18px 24px;
  display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(180deg, rgba(10,10,12,.7) 0%, transparent 100%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition:opacity .4s;
}
.nav-back{
  display:inline-flex; align-items:center; gap:8px;
  color:var(--ink-soft);
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  transition:color .2s, transform .25s;
}
.nav-back:hover{ color:var(--brand-bright); transform:translateX(-2px); }
.nav-brand{
  display:inline-flex; align-items:center; gap:10px;
  font-family:var(--f-sans);
  font-weight:700;
  font-size:15px;
  letter-spacing:-.02em;
  color:var(--ink);
}
.nav-brand .icon{ width:19px; height:22px; color:var(--brand-bright); flex-shrink:0; }
.nav-brand .tag{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--brand-bright);
  font-weight:400;
  padding:3px 8px;
  border:1px solid rgba(8,189,183,.35);
  border-radius:999px;
  margin-left:8px;
}

/* layout — single screen, no scroll */
main{
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding-top:68px;
  padding-bottom:50px;
}

/* slogan */
.slogan{
  margin:0 0 8px;
  text-align:center;
  font-family:var(--f-sans);
  font-weight:200;
  font-size:clamp(18px, 1.9vw, 26px);
  letter-spacing:-.02em;
  line-height:1.1;
  color:var(--ink-soft);
  position:relative; z-index:2;
}
.slogan em{
  font-style:normal;
  color:var(--brand-bright);
  font-weight:300;
}

/* controls */
.controls{
  display:flex; justify-content:center; align-items:flex-end; gap:14px;
  padding:10px 24px 0;
  flex-wrap:wrap;
}
.field{ display:inline-flex; flex-direction:column; gap:6px; }
.field label{
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--ink-mute);
}
.field input{
  width:100px;
  padding:11px 14px;
  border:1px solid rgba(250,250,250,.14);
  border-radius:10px;
  background:rgba(250,250,250,.03);
  color:var(--ink);
  font-family:var(--f-mono);
  font-size:14px;
  letter-spacing:.04em;
  text-align:center;
  transition:border-color .2s, background .2s;
}
.field input:focus{
  border-color:var(--brand-bright);
  background:rgba(8,189,183,.06);
}
.field.field-exclude input{ width:240px; text-align:left; }
.field input[type=number]{ -moz-appearance:textfield; }
.field input::-webkit-outer-spin-button,
.field input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.field-divider{
  width:14px; height:1px;
  background:var(--ink-faint);
  margin:0 2px 18px;
  align-self:flex-end;
}

/* stage */
.stage{
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  padding:0 24px;
  gap:14px;
  position:relative;
  overflow:hidden;
}
.spotlight{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  width:min(820px, 95vw); height:min(820px, 95vw);
  border-radius:50%;
  background:radial-gradient(closest-side, rgba(8,189,183,.22), transparent 70%);
  pointer-events:none;
  filter:blur(40px);
  opacity:.45;
  transition:opacity 1s;
  z-index:0;
}
.stage.is-drawing .spotlight{ opacity:1; }
.stage.is-landed .spotlight{ animation:spotFlash 1.6s cubic-bezier(.2,.7,.2,1); }
@keyframes spotFlash{
  0%   { opacity:1; }
  18%  { opacity:1.5; }
  100% { opacity:.65; }
}

.stage-status{
  font-family:var(--f-mono);
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--brand-bright);
  margin:0;
  display:inline-flex; align-items:center; gap:14px;
  min-height:16px;
  position:relative; z-index:2;
}
.stage-status::before{
  content:""; width:36px; height:1px; background:currentColor; opacity:.6;
}
.stage-status.dim{ color:var(--ink-mute); }
.stage-status.dim::before{ opacity:.3; }
.stage-status.live::before{
  animation:livePulseLine 1.2s ease-in-out infinite;
}
@keyframes livePulseLine{
  0%,100%{ opacity:.4; transform:scaleX(.6); transform-origin:left; }
  50%   { opacity:1;  transform:scaleX(1); }
}

.number-display{
  font-family:var(--f-sans);
  font-weight:200;
  font-size:clamp(120px, 22vw, 300px);
  line-height:.9;
  letter-spacing:-.06em;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  position:relative;
  z-index:2;
  text-shadow:0 0 80px rgba(8,189,183,.15);
  transition:transform .2s, color .3s;
  will-change:transform, color;
  min-width:2ch;
  text-align:center;
  margin:6px 0;
}
.number-display.idle{ color:var(--ink-faint); font-weight:100; }
.number-display.spinning{ color:var(--ink-soft); }
.number-display.landed{
  color:var(--brand-bright);
  animation:landPulse 1.6s cubic-bezier(.2,.7,.2,1);
}
@keyframes landPulse{
  0%   { transform:scale(1);    text-shadow:0 0 80px rgba(8,189,183,.15); }
  28%  { transform:scale(1.08); text-shadow:0 0 200px rgba(8,189,183,.65); }
  100% { transform:scale(1);    text-shadow:0 0 100px rgba(8,189,183,.3); }
}

/* draw button */
.draw-btn{
  margin:6px 0 0;
  display:inline-flex; align-items:center; gap:14px;
  padding:16px 30px;
  background:var(--brand-bright);
  color:var(--night);
  border-radius:999px;
  font-family:var(--f-sans);
  font-weight:700;
  font-size:13px;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s, background .25s, opacity .3s;
  box-shadow:0 0 0 0 rgba(8,189,183,0), 0 12px 30px -8px rgba(8,189,183,.45);
  position:relative; z-index:2;
}
.draw-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 0 0 4px rgba(8,189,183,.18), 0 20px 40px -10px rgba(8,189,183,.55);
}
.draw-btn:active:not(:disabled){ transform:translateY(0); }
.draw-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
  background:var(--night-3);
  color:var(--ink-mute);
  box-shadow:none;
}
.draw-btn .kbd{
  font-family:var(--f-mono);
  font-size:9px;
  padding:3px 7px;
  border-radius:5px;
  background:rgba(10,10,12,.28);
  letter-spacing:.14em;
}
.draw-btn:disabled .kbd{ background:rgba(250,250,250,.05); }

/* secondary actions row */
.secondary-actions{
  margin:0;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  position:relative; z-index:2;
}

/* end button */
.end-btn{
  padding:10px 22px;
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-faint);
  border:1px solid rgba(250,250,250,.1);
  border-radius:999px;
  transition:color .25s, border-color .25s, background .25s, opacity .3s;
  position:relative; z-index:2;
}
.end-btn:hover:not(:disabled){
  color:var(--ink-soft);
  border-color:rgba(250,250,250,.25);
  background:rgba(250,250,250,.03);
}
.end-btn:disabled{ cursor:default; opacity:.35; }
.end-btn.is-closed{
  color:var(--gold);
  border-color:rgba(245,180,80,.4);
  background:rgba(245,180,80,.05);
  opacity:1;
}
.end-btn.is-reset:hover:not(:disabled){
  color:#ff9b9b;
  border-color:rgba(255,155,155,.35);
  background:rgba(255,155,155,.06);
}

/* prize banner */
.prize-banner{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  margin:0;
  padding:12px 28px 16px;
  border:1px solid rgba(8,189,183,.22);
  border-radius:18px;
  background:rgba(8,189,183,.05);
  position:relative; z-index:2;
  text-align:center;
  max-width:min(720px, 92vw);
  animation:bannerIn .7s cubic-bezier(.2,.7,.2,1);
  box-shadow:0 0 60px rgba(8,189,183,.1);
}
.prize-banner[hidden]{ display:none; }
.prize-banner.is-grand{
  border-color:rgba(245,180,80,.5);
  background:rgba(245,180,80,.08);
  box-shadow:0 0 80px rgba(245,180,80,.22);
}
@keyframes bannerIn{
  from{ opacity:0; transform:translateY(10px); }
  to  { opacity:1; transform:translateY(0); }
}
.prize-banner-tag{
  font-family:var(--f-mono);
  font-size:clamp(11px, 1.1vw, 13px);
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--brand-bright);
  font-weight:700;
  padding:6px 14px;
  border:1px solid rgba(8,189,183,.4);
  border-radius:999px;
  background:rgba(8,189,183,.08);
}
.prize-banner.is-grand .prize-banner-tag{
  color:var(--gold);
  border-color:rgba(245,180,80,.45);
  background:rgba(245,180,80,.12);
}
.prize-banner-text{
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.prize-banner-name{
  font-family:var(--f-sans);
  font-weight:400;
  font-size:clamp(24px, 3.2vw, 40px);
  color:var(--ink);
  letter-spacing:-.02em;
  line-height:1.1;
}
.prize-banner.is-grand .prize-banner-name{
  font-weight:500;
  color:var(--gold);
}
.prize-banner-detail{
  font-family:var(--f-sans);
  font-weight:300;
  font-size:clamp(15px, 1.6vw, 21px);
  color:var(--ink-soft);
  letter-spacing:-.005em;
}

/* grand prize stage treatment */
.stage.is-grand .spotlight{
  background:radial-gradient(closest-side, rgba(245,180,80,.28), transparent 70%);
}
.number-display.grand-land{
  color:var(--gold);
  animation:grandLand 1.8s cubic-bezier(.2,.7,.2,1);
}
@keyframes grandLand{
  0%   { transform:scale(1);    text-shadow:0 0 80px rgba(245,180,80,.15); }
  22%  { transform:scale(1.12); text-shadow:0 0 240px rgba(245,180,80,.7); }
  100% { transform:scale(1);    text-shadow:0 0 130px rgba(245,180,80,.35); }
}

/* grand prize draw button */
.draw-btn.is-grand{
  background:var(--gold);
  box-shadow:0 0 0 0 rgba(245,180,80,0), 0 12px 30px -8px rgba(245,180,80,.5);
}
.draw-btn.is-grand:hover:not(:disabled){
  box-shadow:0 0 0 4px rgba(245,180,80,.18), 0 20px 40px -10px rgba(245,180,80,.55);
}

/* grand prize winner card */
.winner-card.is-grand{
  border-color:rgba(245,180,80,.5);
  background:linear-gradient(180deg, rgba(245,180,80,.12), rgba(245,180,80,.03));
  box-shadow:0 0 40px rgba(245,180,80,.12);
}
.winner-card.is-grand .label{ color:var(--gold); }

/* hide controls on projector */
body.fullscreen .controls{
  opacity:0; pointer-events:none;
}

/* winners */
.winners{
  padding:14px 24px 6px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  position:relative; z-index:2;
}
.winners[hidden]{ display:none; }
.winners-title{
  font-family:var(--f-mono);
  font-size:10px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--ink-mute);
  display:inline-flex; align-items:center; gap:14px;
}
.winners-title::before, .winners-title::after{
  content:""; width:36px; height:1px; background:currentColor; opacity:.35;
}
.winners-list{
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
  max-width:1200px;
}
.winner-card{
  min-width:150px;
  padding:12px 18px;
  border:1px solid rgba(8,189,183,.28);
  border-radius:12px;
  background:linear-gradient(180deg, rgba(8,189,183,.08), rgba(8,189,183,.02));
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex; flex-direction:column; gap:4px;
  animation:cardIn .7s cubic-bezier(.2,.7,.2,1);
  position:relative;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(16px) scale(.96); }
  to  { opacity:1; transform:translateY(0) scale(1); }
}
.winner-card .label{
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--brand-bright);
}
.winner-card .num{
  font-family:var(--f-sans);
  font-weight:300;
  font-size:36px;
  letter-spacing:-.03em;
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.winner-card .prize{
  font-family:var(--f-sans);
  font-weight:400;
  font-size:12px;
  color:var(--ink-soft);
  max-width:220px;
  line-height:1.35;
}
.winner-card .time{
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:.2em;
  color:var(--ink-faint);
  text-transform:uppercase;
}

/* helper bar */
.helper{
  position:fixed;
  bottom:18px; left:50%;
  transform:translateX(-50%);
  display:inline-flex; gap:18px;
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--ink-faint);
  z-index:65;
  padding:10px 18px;
  border:1px solid rgba(250,250,250,.08);
  border-radius:999px;
  background:rgba(10,10,12,.55);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:opacity .4s;
}
.helper span{ display:inline-flex; align-items:center; gap:6px; }
.helper .kbd{
  padding:2px 6px;
  border-radius:4px;
  background:rgba(250,250,250,.08);
  color:var(--ink-soft);
  letter-spacing:.14em;
}

/* fullscreen mode */
body.fullscreen .nav-bar,
body.fullscreen .helper{
  opacity:0; pointer-events:none;
}

/* confetti */
.confetti{
  position:fixed; inset:0;
  pointer-events:none;
  z-index:55;
  overflow:hidden;
}
.confetti i{
  position:absolute;
  width:8px; height:12px;
  top:0; left:0;
  background:var(--brand-bright);
  opacity:0;
  will-change:transform, opacity;
}
.confetti i.gold{ background:var(--gold); }
.confetti i.ink{  background:var(--ink); }

/* mobile */
@media (max-width: 700px){
  .nav-bar{ padding:14px 18px; }
  .controls{ gap:10px; padding-top:8px; }
  .field input{ width:92px; padding:10px; }
  .field.field-exclude{ flex-basis:100%; display:flex; align-items:center; }
  .field.field-exclude input{ width:100%; max-width:340px; }
  .field-divider{ display:none; }
  .number-display{ font-size:clamp(120px, 40vw, 280px); }
  .draw-btn{ margin-top:24px; padding:16px 26px; }
  .winners-list{ flex-direction:column; align-items:stretch; }
  .winner-card{ min-width:auto; width:100%; max-width:320px; margin:0 auto; }
  .helper{ font-size:8px; gap:10px; padding:8px 12px; }
  main{ padding-bottom:90px; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<main>
  <section class="controls">
    <div class="field">
      <label for="rangeStart">Du n°</label>
      <input id="rangeStart" type="number" inputmode="numeric" min="1" value="1" />
    </div>
    <span class="field-divider" aria-hidden="true"></span>
    <div class="field">
      <label for="rangeEnd">Au n°</label>
      <input id="rangeEnd" type="number" inputmode="numeric" min="1" value="200" />
    </div>
    <div class="field field-exclude">
      <label for="excludes">Exclure</label>
      <input id="excludes" type="text" placeholder="ex. 1-10, 47" maxlength="120" />
    </div>
  </section>

  <section class="stage" id="stage">
    <span class="spotlight" aria-hidden="true"></span>
    <p class="slogan">Vous dormez <em>où ce soir ?</em></p>
    <span class="stage-status dim" id="status">Prêt pour le tirage</span>
    <div class="prize-banner" id="prizeBanner" hidden>
      <span class="prize-banner-tag" id="prizeBannerTag"></span>
      <span class="prize-banner-text">
        <span class="prize-banner-name" id="prizeBannerName"></span>
        <span class="prize-banner-detail" id="prizeBannerDetail"></span>
      </span>
    </div>
    <div class="number-display idle" id="numberDisplay">···</div>
    <button class="draw-btn" id="drawBtn" type="button">
      <span id="drawBtnLabel">Lancer le tirage</span>
      <span class="kbd">espace</span>
    </button>
    <div class="secondary-actions">
      <button class="end-btn is-reset" id="resetBtn" type="button" disabled>Recommencer</button>
      <button class="end-btn" id="endBtn" type="button">Clôturer le tirage</button>
    </div>
  </section>

  <section class="winners" id="winnersSection" hidden>
    <span class="winners-title">Gagnants</span>
    <div class="winners-list" id="winnersList"></div>
  </section>
</main>

<div class="helper" aria-hidden="true">
  <span><span class="kbd">espace</span> tirer</span>
  <span><span class="kbd">F</span> plein écran</span>
  <span><span class="kbd">R</span> recommencer</span>
</div>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function tombola(){
  const startInput   = document.getElementById('rangeStart');
  const endInput     = document.getElementById('rangeEnd');
  const excludesInput= document.getElementById('excludes');
  const drawBtn      = document.getElementById('drawBtn');
  const drawBtnLabel = document.getElementById('drawBtnLabel');
  const numberDisplay= document.getElementById('numberDisplay');
  const status       = document.getElementById('status');
  const stage        = document.getElementById('stage');
  const winnersSection = document.getElementById('winnersSection');
  const winnersList  = document.getElementById('winnersList');
  const confettiRoot = document.getElementById('confetti');
  const prizeBanner  = document.getElementById('prizeBanner');
  const prizeBannerTag = document.getElementById('prizeBannerTag');
  const prizeBannerName = document.getElementById('prizeBannerName');
  const prizeBannerDetail = document.getElementById('prizeBannerDetail');
  const endBtn       = document.getElementById('endBtn');
  const resetBtn     = document.getElementById('resetBtn');

  const prizeQueue = [
    { tag: 'Lot 1 sur 4',                 name: 'Weekend Kasastay', detail: 'petit-déjeuner inclus', grand: false },
    { tag: 'Lot 2 sur 4',                 name: 'Weekend Kasastay', detail: 'petit-déjeuner inclus', grand: false },
    { tag: 'Lot 3 sur 4',                 name: 'Weekend Kasastay', detail: 'petit-déjeuner inclus', grand: false },
    { tag: 'Grand prix · Lot 4 sur 4',    name: 'Weekend à Kribi',  detail: 'tout frais payés',       grand: true  }
  ];

  const drawn = new Set();
  let isDrawing = false;
  let isClosed = false;

  function readRange(){
    const a = parseInt(startInput.value, 10);
    const b = parseInt(endInput.value, 10);
    if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
    if (a < 1 || b < 1) return null;
    if (b < a) return null;
    return { start:a, end:b };
  }

  function parseExclusions(){
    const str = excludesInput.value.trim();
    const set = new Set();
    if (!str) return set;
    const parts = str.split(/[,;\s]+/);
    for (const part of parts){
      if (!part) continue;
      const range = part.match(/^(\d+)-(\d+)$/);
      if (range){
        const a = parseInt(range[1], 10);
        const b = parseInt(range[2], 10);
        if (Number.isFinite(a) && Number.isFinite(b)){
          const lo = Math.min(a, b);
          const hi = Math.max(a, b);
          for (let i = lo; i <= hi; i++) set.add(i);
        }
      } else {
        const n = parseInt(part, 10);
        if (Number.isFinite(n)) set.add(n);
      }
    }
    return set;
  }

  function availableNumbers(range){
    const excluded = parseExclusions();
    const pool = [];
    for (let i = range.start; i <= range.end; i++){
      if (drawn.has(i)) continue;
      if (excluded.has(i)) continue;
      pool.push(i);
    }
    return pool;
  }

  function currentPrize(){
    return prizeQueue[drawn.size] || null;
  }

  function updatePrizeBanner(){
    const prize = currentPrize();
    if (!prize || isClosed){
      prizeBanner.hidden = true;
      return;
    }
    prizeBanner.hidden = false;
    prizeBanner.classList.toggle('is-grand', !!prize.grand);
    prizeBannerTag.textContent = prize.tag;
    prizeBannerName.textContent = prize.name;
    prizeBannerDetail.textContent = prize.detail;
  }

  function setStatus(text, mode){
    status.textContent = text;
    status.classList.remove('dim', 'live');
    if (mode === 'live')  status.classList.add('live');
    if (mode === 'dim')   status.classList.add('dim');
  }

  function refresh(){
    updatePrizeBanner();
    resetBtn.disabled = !(drawn.size > 0 || isClosed);
    if (isClosed){
      drawBtn.disabled = true;
      drawBtn.classList.remove('is-grand');
      drawBtnLabel.textContent = 'Tirage clôturé';
      startInput.disabled = true;
      endInput.disabled = true;
      excludesInput.disabled = true;
      const n = drawn.size;
      setStatus(`Clôturé · ${n} gagnant${n > 1 ? 's' : ''}`, 'dim');
      return;
    }
    if (isDrawing){ drawBtn.disabled = true; return; }
    const range = readRange();
    if (!range){
      drawBtn.disabled = true;
      drawBtn.classList.remove('is-grand');
      drawBtnLabel.textContent = 'Plage non valide';
      setStatus('Renseignez une plage valide', 'dim');
      return;
    }
    const pool = availableNumbers(range);
    if (pool.length === 0){
      drawBtn.disabled = true;
      drawBtn.classList.remove('is-grand');
      drawBtnLabel.textContent = 'Plage épuisée';
      setStatus('Tous les numéros ont été tirés', 'dim');
      return;
    }
    drawBtn.disabled = false;
    const prize = currentPrize();
    drawBtn.classList.toggle('is-grand', !!(prize && prize.grand));
    if (!prize){
      drawBtnLabel.textContent = 'Tirage bonus';
    } else if (prize.grand){
      drawBtnLabel.textContent = 'Lancer le grand prix';
    } else {
      drawBtnLabel.textContent = drawn.size === 0 ? 'Lancer le tirage' : 'Tirage suivant';
    }
    const excluded = parseExclusions();
    let excludedInRange = 0;
    excluded.forEach(n => { if (n >= range.start && n <= range.end) excludedInRange++; });
    const suffix = excludedInRange > 0 ? ` · ${excludedInRange} exclus` : '';
    if (drawn.size === 0){
      setStatus(`Prêt · ${pool.length} numéros${suffix}`, 'dim');
    } else {
      setStatus(`${drawn.size} gagnant${drawn.size > 1 ? 's' : ''} · ${pool.length} restants`, 'dim');
    }
  }

  function closeTombola(){
    if (isClosed) return;
    if (drawn.size === 0){
      if (!confirm('Aucun tirage n’a encore eu lieu. Clôturer quand même ?')) return;
    } else {
      if (!confirm('Clôturer le tirage ? Plus aucun nouveau tirage ne sera possible.')) return;
    }
    isClosed = true;
    endBtn.textContent = 'Tirage clôturé';
    endBtn.classList.add('is-closed');
    endBtn.disabled = true;
    refresh();
  }
  endBtn.addEventListener('click', closeTombola);

  function pickRandom(pool){
    // crypto for fairness
    if (window.crypto && crypto.getRandomValues){
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return pool[buf[0] % pool.length];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  function formatTime(){
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function addWinner(num, prize){
    winnersSection.hidden = false;
    const card = document.createElement('div');
    const grand = !!(prize && prize.grand);
    card.className = 'winner-card' + (grand ? ' is-grand' : '');
    const idx = winnersList.children.length + 1;
    const labelText = grand ? 'Grand prix' : ('Gagnant ' + idx);
    const prizeText = prize ? prize.name + ' · ' + prize.detail : '';
    card.innerHTML =
      '<span class="label">' + labelText + '</span>' +
      '<span class="num">' + num + '</span>' +
      (prizeText ? '<span class="prize">' + escapeHtml(prizeText) + '</span>' : '') +
      '<span class="time">' + formatTime() + '</span>';
    winnersList.appendChild(card);
  }

  function burstConfetti(isGrand){
    const variants = isGrand ? ['gold', 'gold', 'gold', 'ink'] : ['', 'gold', 'ink'];
    const count = isGrand ? 130 : 70;
    for (let i = 0; i < count; i++){
      const piece = document.createElement('i');
      piece.className = variants[Math.floor(Math.random() * variants.length)];
      const startX = 35 + Math.random() * 30;   // vw
      const drift  = (Math.random() - 0.5) * 70; // vw
      const duration = 2400 + Math.random() * 1600;
      const delay = Math.random() * 300;
      const rot = Math.random() * 1080 - 540;
      piece.style.left = startX + 'vw';
      piece.style.top  = '38vh';
      piece.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 0 },
        { transform: 'translate(' + (drift*0.18) + 'vw, -12vh) rotate(' + (rot*0.18) + 'deg)', opacity: 1, offset: 0.08 },
        { transform: 'translate(' + drift + 'vw, 72vh) rotate(' + rot + 'deg)', opacity: 0 }
      ], { duration, delay, easing:'cubic-bezier(.2,.7,.4,1)', fill:'forwards' });
      confettiRoot.appendChild(piece);
      setTimeout(() => piece.remove(), duration + delay + 100);
    }
  }

  function drawNumber(){
    if (isDrawing || isClosed) return;
    const range = readRange();
    if (!range) return;
    const pool = availableNumbers(range);
    if (pool.length === 0) return;

    const prize = currentPrize();
    const isGrand = !!(prize && prize.grand);

    isDrawing = true;
    drawBtn.disabled = true;
    stage.classList.remove('is-landed', 'is-grand');
    stage.classList.add('is-drawing');
    if (isGrand) stage.classList.add('is-grand');
    numberDisplay.classList.remove('idle', 'landed', 'grand-land');
    numberDisplay.classList.add('spinning');
    setStatus(isGrand ? 'Grand prix · tirage en cours' : 'Tirage en cours', 'live');

    const finalNum = pickRandom(pool);
    const duration = isGrand ? 4500 : 3000;
    const start = performance.now();
    let lastSwap = 0;
    let last = -1;

    function frame(now){
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutCubic(t);
      const swapInterval = 32 + eased * 280;

      if (now - lastSwap >= swapInterval){
        let shown;
        if (t > 0.94){
          shown = finalNum;
        } else {
          do { shown = pool[Math.floor(Math.random() * pool.length)]; }
          while (shown === last && pool.length > 1);
        }
        numberDisplay.textContent = shown;
        last = shown;
        lastSwap = now;
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        numberDisplay.textContent = finalNum;
        numberDisplay.classList.remove('spinning');
        numberDisplay.classList.add(isGrand ? 'grand-land' : 'landed');
        stage.classList.remove('is-drawing');
        stage.classList.add('is-landed');
        drawn.add(finalNum);
        addWinner(finalNum, prize);
        setStatus((isGrand ? 'Grand prix · numéro ' : 'Gagnant · numéro ') + finalNum, '');
        burstConfetti(isGrand);
        setTimeout(() => {
          isDrawing = false;
          refresh();
        }, isGrand ? 1800 : 1200);
      }
    }
    requestAnimationFrame(frame);
  }

  drawBtn.addEventListener('click', drawNumber);
  startInput.addEventListener('input', refresh);
  endInput.addEventListener('input', refresh);
  excludesInput.addEventListener('input', refresh);

  document.addEventListener('keydown', (e) => {
    const inField = e.target.tagName === 'INPUT';
    if (inField){
      if (e.key === 'Enter'){
        e.target.blur();
      }
      return;
    }
    if (e.key === 'f' || e.key === 'F'){
      toggleFullscreen();
      return;
    }
    if (e.key === 'r' || e.key === 'R'){
      resetAll();
      return;
    }
    if (isClosed) return;
    if (e.code === 'Space'){
      e.preventDefault();
      drawNumber();
    }
  });

  function toggleFullscreen(){
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  }
  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
  });

  function resetAll(){
    if (isDrawing) return;
    if (drawn.size === 0 && !isClosed) return;
    const msg = isClosed
      ? 'Le tirage est clôturé. Recommencer effacera les gagnants et déverrouillera la page.'
      : 'Recommencer le tirage ? Tous les gagnants seront effacés.';
    if (!confirm(msg)) return;
    drawn.clear();
    winnersList.innerHTML = '';
    winnersSection.hidden = true;
    numberDisplay.textContent = '···';
    numberDisplay.classList.remove('landed', 'grand-land', 'spinning');
    numberDisplay.classList.add('idle');
    stage.classList.remove('is-drawing', 'is-landed', 'is-grand');
    if (isClosed){
      isClosed = false;
      endBtn.disabled = false;
      endBtn.classList.remove('is-closed');
      endBtn.textContent = 'Clôturer le tirage';
      startInput.disabled = false;
      endInput.disabled = false;
      excludesInput.disabled = false;
    }
    refresh();
  }
  resetBtn.addEventListener('click', resetAll);

  refresh();
})();
</script>
</body>
</html>
